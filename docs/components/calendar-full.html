<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar — Full page — Cendyn Design System</title>
  <link rel="stylesheet" href="../css/docs.css">
  <style>
    /* Full-page calendar: body has no margin so calendar can fill viewport */
    body.calendar-full-page { margin: 0; min-height: 100vh; }
  </style>
</head>
<body class="calendar-full-page min-h-screen bg-white">
  <div class="calendar-full">
    <header class="calendar-header">
      <div class="calendar-header-nav">
        <div class="flex items-center gap-space-12">
          <button type="button" class="calendar-prev-month text-neutrals-black hover:text-primary" aria-label="Previous month">
            <svg xmlns="http://www.w3.org/2000/svg" width="8" height="14" viewBox="0 0 8 14" fill="none">
              <path d="M6.75 12.75L0.75 6.75L6.75 0.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
          </button>
          <button type="button" class="calendar-next-month text-neutrals-black hover:text-primary" aria-label="Next month">
            <svg xmlns="http://www.w3.org/2000/svg" width="8" height="14" viewBox="0 0 8 14" fill="none">
              <path d="M0.75 12.75L6.75 6.75L0.75 0.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
          </button>
        </div>
        <div class="calendar-month-dropdown" aria-label="Change month" aria-haspopup="true">
          <span>August 2021</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" class="text-neutrals-black hover:cursor-pointer hover:text-primary">
            <path d="M4 6L8 10L12 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
      </div>
      <a href="calendars.html" class="btn-link-primary">Return to Today</a>
    </header>
    <div class="calendar-weekdays">
      <span class="calendar-weekday">Sun</span>
      <span class="calendar-weekday calendar-weekday-current">Mon</span>
      <span class="calendar-weekday">Tue</span>
      <span class="calendar-weekday">Wed</span>
      <span class="calendar-weekday">Thu</span>
      <span class="calendar-weekday">Fri</span>
      <span class="calendar-weekday">Sat</span>
    </div>
    <div class="calendar-body">
      <div class="calendar-dates-row">
        <span class="calendar-day">1</span>
        <span class="calendar-day">2</span>
        <span class="calendar-day">3</span>
        <span class="calendar-day">4</span>
        <span class="calendar-day">5</span>
        <span class="calendar-day">6</span>
        <span class="calendar-day">7</span>
      </div>
      <div class="calendar-dates-row">
        <span class="calendar-day">8</span>
        <span class="calendar-day selected"><span class="calendar-day-oval">9</span></span>
        <span class="calendar-day">10</span>
        <span class="calendar-day">11</span>
        <span class="calendar-day">12</span>
        <span class="calendar-day">13</span>
        <span class="calendar-day">14</span>
      </div>
      <div class="calendar-dates-row">
        <span class="calendar-day">15</span>
        <span class="calendar-day">16</span>
        <span class="calendar-day">17</span>
        <span class="calendar-day">18</span>
        <span class="calendar-day">19</span>
        <span class="calendar-day">20</span>
        <span class="calendar-day">21</span>
      </div>
      <div class="calendar-dates-row">
        <span class="calendar-day">22</span>
        <span class="calendar-day">23</span>
        <span class="calendar-day">24</span>
        <span class="calendar-day">25</span>
        <span class="calendar-day">26</span>
        <span class="calendar-day">27</span>
        <span class="calendar-day">28</span>
      </div>
      <div class="calendar-dates-row">
        <span class="calendar-day">29</span>
        <span class="calendar-day">30</span>
        <span class="calendar-day">31</span>
        <span class="calendar-day nextMonthDay">1</span>
        <span class="calendar-day nextMonthDay">2</span>
        <span class="calendar-day nextMonthDay">3</span>
        <span class="calendar-day nextMonthDay">4</span>
      </div>
    </div>
  </div>
</body>
</html>
